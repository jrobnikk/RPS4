services:
  baza:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_GESLO}
      MARIADB_DATABASE: sola_is
      MARIADB_USER: ${DB_UPORABNIK}
      MARIADB_PASSWORD: ${DB_GESLO}
    volumes:
      - baza_podatki:/var/lib/mysql
      - ./baza:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  aplikacija:
    build: ./aplikacija
    restart: unless-stopped
    depends_on:
      baza:
        condition: service_healthy
    expose:
      - "3000"
    env_file: .env
    volumes:
      - datoteke:/data/uploads

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - aplikacija
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/certbot:/var/www/certbot:ro

volumes:
  baza_podatki:
  datoteke:
